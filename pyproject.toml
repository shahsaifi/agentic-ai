[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-learning-agent"
version = "0.1.0"
description = "An autonomous Gemini-powered agent that curates the latest Generative AI research, news, and engineering insights into a structured learning digest."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
genai-agent = "genai_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
