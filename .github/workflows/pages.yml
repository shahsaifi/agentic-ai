name: Daily GenAI Digest & GitHub Pages Deploy

on:
  push:
    branches: ["main"]
  schedule:
    # Runs every day at 22:45 UTC (06:45 AM SGT / UTC+8) so the page is live before 7:00 AM SGT
    - cron: "45 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  TZ: Asia/Singapore

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Auto-generate today's GenAI digest & HTML pages on GitHub
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          pip install .
          TODAY=$(date +%Y-%m-%d)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ ! -f "digests/${TODAY}_genai_digest.md" ]; then
            echo "Generating fresh digest and HTML pages for ${TODAY}..."
            genai-agent --quiet
          else
            echo "Today's digest (${TODAY}) already exists; refreshing HTML pages..."
            python -c "from pathlib import Path; from datetime import datetime; from genai_agent.notifiers.markdown_store import save_markdown_digest; md = Path('digests/${TODAY}_genai_digest.md').read_text(encoding='utf-8'); save_markdown_digest(md, Path('digests'), timestamp=datetime.now())"
          fi

      - name: Commit auto-generated pages back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/ docs/
          if ! git diff --staged --quiet; then
            git commit -m "chore(digest): auto-generate daily GenAI digest $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
